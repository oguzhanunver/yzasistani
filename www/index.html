<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />
  <title>YZ Asistanı</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body { background: #fff; display: grid; place-items: center; }
    .splash { width: 100vw; height: 100vh; display: grid; place-items: center; }
    .splash img { width: min(34vw, 148px); height: min(34vw, 148px); object-fit: contain; animation: logo-in .65s ease-out both; }
    @media (prefers-color-scheme: dark) { body { background: #191a1e; } }
    @keyframes logo-in { from { opacity: 0; transform: scale(.82); } to { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <main class="splash" aria-label="YZ Asistanı yükleniyor"><img src="icon.png" alt="YZ Asistanı" /></main>
  <script>
    setTimeout(function () { window.location.replace('https://sohbet.yzasistani.tr'); }, 1200);
  </script>
</body>
</html>
